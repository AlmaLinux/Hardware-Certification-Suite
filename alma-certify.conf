# alma-certify configuration. Command-line flags override these values.

[general]
run_dir = /var/lib/alma-certify/runs
# Catalog base URL for `alma-certify register` / `alma-certify submit`.
# Overridden by $ALMA_CERTIFY_SERVER, by --dev (the staging catalog), and by --server.
server = https://catalog.almalinux.org
# Written by `alma-certify register`, mode 0600. A credential, not configuration.
token_path = /var/cache/alma-certify/token.json
# Accept the server's TLS certificate without verifying it. For a dev or staging catalog
# serving a self-signed certificate; --allow-self-signed does the same for one command.
# This accepts ANY certificate from whatever answers on that address, and stops checking
# that the name matches, so set it only for a server you know. Every run then says on
# stderr that verification is off. For a self-signed certificate you have a copy of, adding
# it to the host's trust store is the better answer and leaves this alone.
allow_self_signed = false

[validate]
# Validation verifies that things WORK, not how long they survive load.
# These are short functional smoke durations, in seconds.
cpu_smoke_seconds = 60
memory_smoke_seconds = 60
io_smoke_seconds = 60
network_smoke_seconds = 30
# data-path check gate: fraction of the NIC's link rate that must be reached
network_min_fraction = 0.5

[benchmark]
cooldown_seconds = 8
# directory (on the filesystem to be measured) for storage benchmarks;
# empty means /var/tmp
storage_target_dir =
storage_file_size_mb = 4096
corpus_size_mb = 512

[network]
# peer host running `iperf3 -s`, for throughput tests
peer =
iperf3_port = 5201

[timeouts]
# Per-test overrides in seconds, keyed by test id, e.g.
# validate.cpu.functional = 1200
