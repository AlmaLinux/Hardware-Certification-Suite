# Kernel log patterns for validate.kernel.dmesg.
# [deny] lines matching these regexes fail the test,
# [allow] lines matching these are ignored even if a deny pattern matches.

[deny]
Hardware Error
Machine Check
MCE:
I/O error
EXT4-fs error
XFS .* Corruption
segfault at .* in kernel
BUG: unable to handle
kernel NULL pointer dereference
general protection fault
Call Trace:
soft lockup
hard LOCKUP
page allocation failure
Out of memory: Kill
blk_update_request: critical
critical medium error
critical target error
PCIe Bus Error.*severity=(Uncorrected|Fatal)
thermal.*critical

[allow]
# ACPI firmware complaints are ubiquitous and rarely actionable
ACPI (BIOS|Warning|Error):
# EFI variable noise on some vendors
efivars.*duplicate variable
# TPM self-test chatter
tpm.*A TPM error
# iwlwifi/microcode informational resets
microcode.*reload
